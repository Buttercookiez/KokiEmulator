// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    // Keep generated outputs away from OneDrive file locks when the CLI supplies
    // an isolated cache. Source code and the delivered APK stay in the project.
    def isolatedBuildRoot = System.getenv('KOKI_ANDROID_BUILD_ROOT')
    if (isolatedBuildRoot) {
        layout.buildDirectory.set(new File(isolatedBuildRoot, project == rootProject ? '_root' : project.name))
    }
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
